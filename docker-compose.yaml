version: '2.3'
services:
  xserver:
    image: devrt/xserver
    ipc: host
    security_opt:
      - seccomp:unconfined
    ports:
      - "12345:80"
    healthcheck:
      test: [ "CMD-SHELL", "test -e /tmp/.X11-unix/X0" ]
      interval: "1s"
      retries: 20
  workspace:
    image: ghcr.io/jkaflik/openmowerros2:main
    build:
      context: .
      dockerfile: Dockerfile
    ipc: host
    privileged: true
    security_opt:
      - seccomp:unconfined
    volumes:
      - /dev:/dev
      - build:/home/ws/build # keep container pre-build
      - install:/home/ws/install # keep container pre-build
      - log:/home/ws/log # keep container pre-build
      - ./maps:/opt/ws/maps
      - ./scripts/entrypoint.sh:/opt/ws/entrypoint.sh
      - ./scripts/coverage_goal_bridge.py:/opt/ws/coverage_goal_bridge.py
      - ./scripts/synthetic_scan.py:/opt/ws/synthetic_scan.py
      - ./scripts/obstacle_map_publisher.py:/opt/ws/obstacle_map_publisher.py
      - ./scripts/ackermann_hils_bridge.py:/opt/ws/ackermann_hils_bridge.py
      - ./launch/sim.launch.py:/opt/ws/install/open_mower_next/share/open_mower_next/launch/sim.launch.py
      - ./launch/nav2.launch.py:/opt/ws/install/open_mower_next/share/open_mower_next/launch/nav2.launch.py
      - ./worlds:/opt/ws/install/open_mower_next/share/open_mower_next/worlds
      # Mount description and config so changes to radar.xacro, robot.urdf.xacro,
      # yardforce500.yaml, nav2_params.yaml, and openmower.rviz are picked up
      # without rebuilding the image.
      - ./description:/opt/ws/install/open_mower_next/share/open_mower_next/description
      - ./config:/opt/ws/install/open_mower_next/share/open_mower_next/config
      - ./scripts/mower_nav_client.py:/opt/ws/mower_nav_client.py
    environment:
      - DISPLAY=:0
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=42
      # Datum must match the spherical_coordinates in open_field.sdf so the
      # map frame origin sits at the Gazebo world origin instead of 4 million
      # meters away at the equator/prime meridian.
      - OM_DATUM_LAT=-22.9
      - OM_DATUM_LONG=-43.2
      - OM_MAP_PATH=/opt/ws/maps/map.geojson
      # Software rendering for Gazebo display/camera sensors in Docker/WSL2.
      - LIBGL_ALWAYS_SOFTWARE=1
    command: bash /opt/ws/entrypoint.sh
    volumes_from:
      - xserver
    depends_on:
      - xserver
volumes:
  build:
  install:
  log:
